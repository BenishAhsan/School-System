<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Record | Hogwards School System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-hogwards">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/hogwards-logo.png" alt="Hogwards Logo">
                Hogwards School System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="list.html">Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="teachers.html">Teachers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="classes.html">Classes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="add.html">Add New</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="header-hogwards">
        <div class="container text-center">
            <h1>Add New Record</h1>
            <p class="lead">Expand the Hogwards community</p>
        </div>
    </header>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-hogwards">
                    <div class="card-header">
                        <h5>New Student Information</h5>
                    </div>
                    <div class="card-body">
                        <form class="form-hogwards">
                            <div class="mb-3">
                                <label for="studentName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="studentName" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="birthDate" class="form-label">Date of Birth</label>
                                    <input type="date" class="form-control" id="birthDate" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="house" class="form-label">House</label>
                                    <select class="form-select" id="house" required>
                                        <option value="" selected disabled>Select House</option>
                                        <option value="gryffindor">Gryffindor</option>
                                        <option value="hufflepuff">Hufflepuff</option>
                                        <option value="ravenclaw">Ravenclaw</option>
                                        <option value="slytherin">Slytherin</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="parentName" class="form-label">Parent/Guardian Name</label>
                                <input type="text" class="form-control" id="parentName" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" rows="3" required></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="photo" class="form-label">Student Photo</label>
                                <input class="form-control" type="file" id="photo">
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-hogwards">Submit</button>
                                <button type="reset" class="btn btn-hogwards-outline">Clear Form</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer-hogwards text-center mt-5">
        <div class="container">
            <p>&copy; 2023 Hogwards School System. All rights reserved.</p>
            <p>Learning Made Fun</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
